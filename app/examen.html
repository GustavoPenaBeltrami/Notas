<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Exámenes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="estilo.css">
<script src="tema.js"></script>
<script src="viz.js"></script>
<script src="shell.js"></script>
<style>
  .pregunta { padding: var(--spacing-16) 0 var(--spacing-24); }
  .pregunta + .pregunta { border-top: 1px dashed var(--linea); }
  .enunciado { display: flex; gap: .8rem; margin: 0 0 .7rem; }
  .enunciado .num { color: var(--ansi-orange); flex: none; }
  .opcion { display: flex; gap: .7rem; padding: .15rem 0 .15rem 3.4rem; cursor: pointer; }
  .opcion:hover { background: var(--color-graphite); }
  .opcion input { position: absolute; opacity: 0; pointer-events: none; }
  .opcion .caja { flex: none; color: var(--gris); }
  .opcion .caja::before { content: '( )'; }
  .opcion input:checked + .caja { color: var(--acento); }
  .opcion input:checked + .caja::before { content: '(•)'; }
  .opcion input:checked ~ span:last-child { color: var(--tinta); font-weight: 700; }
  .opcion input:focus-visible + .caja { outline: 1px solid var(--acento); }

  .corregida { display: flex; gap: .7rem; padding: .15rem 0 .15rem 3.4rem; color: var(--gris); }
  .corregida .marca { flex: none; width: 3ch; text-align: center; }
  .corregida.correcta { color: var(--bien); }
  .corregida.elegida-mal { color: var(--mal); }
  .corregida.elegida-mal span:last-child { text-decoration: line-through; }
  .porque { margin: .7rem 0 0 3.4rem; color: var(--gris); }
  .porque::before { content: '// '; color: var(--color-steel); }

  .medidor { display: flex; align-items: baseline; gap: .2rem; margin: var(--spacing-16) 0 .3rem; font-size: 16px; }
  .medidor .etq { color: var(--ansi-cyan); }
  .medidor .celdas { white-space: pre; color: var(--color-slate); }
  .medidor .lleno { color: var(--bien); }
  .medidor.mal .lleno { color: var(--mal); }
  .medidor .pct { color: var(--tinta); font-weight: 700; }

  .respuesta { display: block; width: 100%; margin-top: .3rem; padding: .6rem .7rem;
    background: var(--color-graphite); color: var(--tinta); border: 1px solid var(--linea);
    border-radius: var(--radius-sm); font: 400 var(--text-body)/1.5 var(--mono); resize: vertical; }
  .oral { margin-top: .3rem; display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
  .oral-preview { height: 2.2rem; }
  .grabar.grabando { color: var(--mal); animation: latir .8s ease-in-out infinite alternate; }
  @keyframes latir { to { opacity: .35; } }
  .respuesta-dada { margin: .3rem 0 0; color: var(--tinta); white-space: pre-wrap; }
  .pendiente { margin: .3rem 0 0; color: var(--ansi-yellow); }
  .pendiente::before { content: '// '; color: var(--color-steel); }
</style>

<body>
<script>
const { app, arbol, herramientas, ruta, modo } = montarShell('exámenes');
const estado = document.getElementById('estado');
const mezclar = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(p => p[1]);
const esc = s => String(s).replace(/[<>&"]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]));
const archivo = new URLSearchParams(location.search).get('f');
const tecla = (k, texto, extra = '') => `<button class="tecla ${extra}"><kbd>${k}</kbd><span>${texto}</span></button>`;

function armarArbol(temas) {
  arbol.innerHTML = temas.map(t => {
    const actual = t.examenes.some(e => e.ruta === archivo);
    return `<details open${actual ? ' class="actual"' : ''}>
      <summary title="${esc(t.titulo)}"><span class="nombre">${esc(t.slug)}/</span><span class="cuenta">${t.examenes.length}</span></summary>
      <ul>${t.examenes.map(e => `<li><a href="?f=${encodeURIComponent(e.ruta)}"${e.ruta === archivo ? ' aria-current="page"' : ''}
          title="${esc(e.titulo)}"><span class="n">›</span><span>${esc(e.titulo)}</span></a></li>`).join('')
        || '<li class="vacio">(sin exámenes)</li>'}</ul>
    </details>`;
  }).join('');
}

async function cargar() {
  const datos = await (await fetch('/api/index')).json();
  armarArbol(datos.temas);
  return datos.temas;
}

async function indice() {
  let temas;
  try {
    temas = await cargar();
  } catch {
    app.innerHTML = `<div class="hoja"><p class="prompt"><span class="p-sig">✕</span> falta el servidor</p>
      <p>Abrí una terminal acá y corré <code>npm run app</code>.</p></div>`;
    return;
  }
  ruta('~/notes/temas/*/examenes');
  app.innerHTML = `
    <div class="hoja">
    <p class="prompt"><span class="p-host">notes</span> <span class="p-dir">~/temas</span> <span class="p-sig">❯</span> ls */examenes</p>
    <table class="htop">
      <thead><tr><th class="num">#</th><th>TEMA</th><th>TIPO</th><th class="num">EXÁMENES</th></tr></thead>
      <tbody>${temas.map(l => `
        <tr>
          <td class="num">${l.orden < 999 ? String(l.orden).padStart(2, '0') : '—'}</td>
          <td class="ancha">${esc(l.titulo)}<br><span class="sub">${esc(l.subtitulo || '')}</span></td>
          <td class="tipo">${esc(l.tipo)}</td>
          <td class="num${l.examenes.length ? '' : ' cero'}">${l.examenes.length}</td>
        </tr>${l.examenes.map(e => `
        <tr onclick="location.search='?f=${encodeURIComponent(e.ruta)}'">
          <td></td><td class="ancha" colspan="3"><span class="sub">└─ </span><a href="?f=${encodeURIComponent(e.ruta)}">${esc(e.titulo)}</a></td>
        </tr>`).join('')}`).join('')}</tbody>
    </table>
    <div class="tildes"></div></div>`;
}

function encabezado(examen, n, comando) {
  const nombre = archivo.split('/').pop();
  return `
    <div class="hoja">
    <p class="prompt"><span class="p-host">notes</span> <span class="p-dir">~/${esc(archivo.split('/').slice(0, -1).join('/'))}</span> <span class="p-sig">❯</span> ${comando} ${esc(nombre)}</p>
    <h1>${esc(examen.titulo || 'Examen')}</h1>
    <p class="menor"># ${n} preguntas · se corrige al final</p>`;
}

function rendir(examen) {
  const preguntas = mezclar(examen.preguntas);
  document.title = examen.titulo || 'Examen';
  ruta('~/notes/' + archivo);

  app.innerHTML = encabezado(examen, preguntas.length, 'exam') + `
    ${preguntas.map((p, i) => preguntaHTML(p, i)).join('')}
    <div class="teclas">${tecla('⏎', 'Corregir', 'cta')}${tecla('Esc', 'Volver')}</div>
    <div class="tildes"></div></div>`;

  vizPaint(app);
  app.querySelectorAll('.oral').forEach(div => {
    const pregunta = div.closest('.pregunta');
    if (!navigator.mediaDevices?.getUserMedia) return mostrarTexto(pregunta);
    div.querySelector('.grabar').onclick = () => grabarOral(div.querySelector('.grabar'), div.querySelector('.oral-preview'));
    div.querySelector('.escribir-en-vez').onclick = () => mostrarTexto(pregunta);
  });
  const progreso = () => {
    const marcadas = app.querySelectorAll('input:checked').length;
    const escritas = [...app.querySelectorAll('textarea.respuesta')].filter(t => t.value.trim()).length;
    const orales = [...app.querySelectorAll('.oral-preview')].filter(a => a._blob).length;
    const n = marcadas + escritas + orales;
    estado.textContent = `${n}/${preguntas.length} respondidas`;
    modo(n ? 'INSERT' : 'NORMAL', n ? 'insert' : '');
  };
  progreso();
  app.addEventListener('change', progreso);
  app.addEventListener('input', progreso);
  const [corregirBtn, volverBtn] = app.querySelectorAll('.teclas .tecla');
  corregirBtn.onclick = () => corregir(examen, preguntas);
  volverBtn.onclick = () => location.href = 'examen.html';
}

function preguntaHTML(p, i) {
  const tipo = p.tipo || 'opcion_multiple';
  const enunciado = `<p class="enunciado"><span class="num">[${String(i + 1).padStart(2, '0')}]</span><span>${vizText(p.q)}</span></p>`;
  if (tipo === 'opcion_multiple') {
    return `<div class="pregunta">${enunciado}
      ${p.opciones.map((o, j) => `
        <label class="opcion"><input type="radio" name="q${i}" value="${j}"><span class="caja"></span><span>${vizText(o)}</span></label>`).join('')}
    </div>`;
  }
  if (tipo === 'oral') {
    return `<div class="pregunta">${enunciado}
      <div class="oral">
        ${tecla('●', 'Grabar', 'grabar')}
        <audio class="oral-preview" controls style="display:none"></audio>
        ${tecla('T', 'Responder por escrito', 'escribir-en-vez')}
      </div>
      <textarea class="respuesta oral-texto" name="q${i}" rows="4" placeholder="Tu respuesta" style="display:none"></textarea>
    </div>`;
  }
  return `<div class="pregunta">${enunciado}
      <textarea class="respuesta" name="q${i}" rows="4" placeholder="Tu respuesta"></textarea>
    </div>`;
}

function mostrarTexto(pregunta) {
  const oral = pregunta.querySelector('.oral');
  if (oral) oral.style.display = 'none';
  const t = pregunta.querySelector('.oral-texto');
  t.style.display = '';
  t.focus();
}

function medidor(pct) {
  const celdas = 40, llenas = Math.round(pct / 100 * celdas);
  return `<div class="medidor ${pct >= 70 ? 'bien' : 'mal'}"><span class="etq">Score</span><span class="celdas">[<span class="lleno">${'|'.repeat(llenas)}</span>${' '.repeat(celdas - llenas)}]</span><span class="pct">${pct}%</span></div>`;
}

async function grabarOral(boton, audio) {
  if (boton.dataset.grabando) { boton.dataset.parar = '1'; return; }
  let mic;
  try {
    mic = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    estado.textContent = 'Sin micrófono: ' + e.message;
    return mostrarTexto(boton.closest('.pregunta'));
  }
  const grabador = new MediaRecorder(mic);
  const trozos = [];
  grabador.ondataavailable = e => e.data.size && trozos.push(e.data);
  const detenido = new Promise(r => grabador.onstop = r);
  grabador.start();

  boton.dataset.grabando = '1';
  boton.classList.add('grabando');
  estado.textContent = 'Grabando… clic en grabar para terminar';
  await new Promise(r => (function chequear() { boton.dataset.parar ? r() : setTimeout(chequear, 200); })());

  grabador.stop();
  await detenido;
  mic.getTracks().forEach(t => t.stop());
  delete boton.dataset.grabando;
  delete boton.dataset.parar;
  boton.classList.remove('grabando');

  const blob = new Blob(trozos, { type: grabador.mimeType });
  audio._blob = blob;
  audio._mime = blob.type;
  audio.src = URL.createObjectURL(blob);
  audio.style.display = '';
  estado.textContent = 'Grabación lista';
  audio.dispatchEvent(new Event('input', { bubbles: true }));
}

const blobABase64 = blob => new Promise((res, rej) => {
  const r = new FileReader();
  r.onload = () => res(r.result.split(',')[1]);
  r.onerror = rej;
  r.readAsDataURL(blob);
});

async function corregir(examen, preguntas) {
  let bien = 0, totalMC = 0;
  const respuestas = [];
  const detalle = (await Promise.all(preguntas.map(async (p, i) => {
    const tipo = p.tipo || 'opcion_multiple';
    const enunciado = `<p class="enunciado"><span class="num">[${String(i + 1).padStart(2, '0')}]</span><span>${vizText(p.q)}</span></p>`;
    if (tipo === 'opcion_multiple') {
      totalMC++;
      const sel = document.querySelector(`input[name=q${i}]:checked`);
      const elegida = sel ? +sel.value : null;
      if (elegida === p.correcta) bien++;
      respuestas.push({ i, tipo, elegida });
      return `<div class="pregunta">${enunciado}
        ${p.opciones.map((o, j) => {
          const cls = j === p.correcta ? 'correcta' : (j === elegida ? 'elegida-mal' : '');
          const marca = j === p.correcta ? '✓' : (j === elegida ? '✕' : '·');
          return `<div class="corregida ${cls}"><span class="marca">${marca}</span><span>${vizText(o)}</span></div>`;
        }).join('')}
        ${p.explicacion ? `<p class="porque">${vizText(p.explicacion)}</p>` : ''}
      </div>`;
    }
    if (tipo === 'oral') {
      const pregEl = app.querySelectorAll('.pregunta')[i];
      const audio = pregEl.querySelector('.oral-preview');
      if (audio._blob) {
        respuestas.push({ i, tipo, audio: await blobABase64(audio._blob), mime: audio._mime });
        return `<div class="pregunta">${enunciado}
          <p class="respuesta-dada">(audio grabado)</p>
          <p class="pendiente">pendiente de corrección</p>
        </div>`;
      }
      const texto = pregEl.querySelector('.oral-texto').value.trim();
      respuestas.push({ i, tipo, texto });
      return `<div class="pregunta">${enunciado}
        <p class="respuesta-dada">${texto ? esc(texto) : '<em>(sin responder)</em>'}</p>
        <p class="pendiente">pendiente de corrección</p>
      </div>`;
    }
    const texto = document.querySelector(`textarea[name=q${i}]`)?.value.trim() || '';
    respuestas.push({ i, tipo, texto });
    return `<div class="pregunta">${enunciado}
      <p class="respuesta-dada">${texto ? esc(texto) : '<em>(sin responder)</em>'}</p>
      <p class="pendiente">pendiente de corrección</p>
    </div>`;
  }))).join('');

  const pct = totalMC ? Math.round(bien / totalMC * 100) : null;
  const [slug, , examenId] = archivo.split('/').slice(1);
  let guardado;
  try {
    guardado = await (await fetch('/api/intento', {
      method: 'POST', body: JSON.stringify({ slug, examen: examenId, respuestas })
    })).json();
  } catch (e) {
    guardado = { error: e.message };
  }
  const pie = guardado.error
    ? `no se pudo guardar el intento: ${esc(guardado.error)}`
    : `corré <code>notas-correjir</code> sobre este intento — guardado en <code>${esc(guardado.ruta)}</code>`;

  app.innerHTML = encabezado(examen, preguntas.length, 'exam --check') + `
    ${pct !== null ? medidor(pct) : ''}
    <p class="menor"># ${totalMC ? `${bien} de ${totalMC} correctas (opción múltiple)` : 'sin preguntas de opción múltiple'}</p>
    ${detalle}
    <p class="menor">${pie}</p>
    <div class="teclas">${tecla('⏎', 'Rendir de nuevo', 'cta')}${tecla('Esc', 'Volver')}</div>
    <div class="tildes"></div></div>`;
  vizPaint(app);
  modo(pct === null ? 'LISTO' : (pct >= 70 ? 'PASS' : 'FAIL'), pct !== null && pct >= 70 ? 'insert' : '');
  estado.textContent = totalMC ? `${bien}/${totalMC} correctas` : 'intento guardado';
  const [otra, volver] = app.querySelectorAll('.teclas .tecla');
  otra.onclick = () => location.reload();
  volver.onclick = () => location.href = 'examen.html';
  scrollTo(0, 0);
}

addEventListener('keydown', e => {
  if (!archivo || e.target.closest?.('textarea, select, button')) return;
  if (e.key === 'Escape') location.href = 'examen.html';
  if (e.key === 'Enter') app.querySelector('.tecla.cta')?.click();
});

archivo
  ? Promise.all([fetch('/' + archivo).then(r => r.json()), cargar()]).then(([examen]) => rendir(examen))
      .catch(e => app.innerHTML = `<div class="hoja"><p class="prompt"><span class="p-sig">✕</span> no se pudo abrir el examen</p><p class="menor">${esc(e)}</p></div>`)
  : indice();
</script>
