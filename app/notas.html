<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Notas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400&family=JetBrains+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="estilo.css">
<script src="tema.js"></script>
<script src="viz.js"></script>
<script src="shell.js"></script>
<style>
  .pagina { max-width: calc(var(--ancho) + 2 * var(--gutter)); margin: 0 auto; padding: var(--spacing-24) var(--gutter) 0; }

  :root[data-fuente="serif"] { --lectura: var(--serif); }
  :root[data-fuente="inter"] { --lectura: Inter, "SF Pro Text", -apple-system, "Helvetica Neue", sans-serif; }
  :root[data-fuente="mono"]  { --lectura: var(--mono); }
  .doc { font-family: var(--lectura, var(--mono)); }
  :root[data-fuente="serif"] .doc, :root[data-fuente="inter"] .doc { font-size: 15px; }

  .portada { margin: 0 0 var(--spacing-32); }
  .portada h1 { font-size: var(--text-display); line-height: var(--leading-display); margin: 0; outline: 0; color: var(--tinta); }
  .portada #subtitulo { color: var(--gris); margin: .3rem 0 0; outline: 0; }
  .portada #subtitulo::before { content: '# '; color: var(--color-steel); }
  .portada #subtitulo:empty::after { content: 'subtítulo del tema'; color: var(--color-slate); }

  .doc { position: relative; counter-reset: h1 ln; outline: 0; min-height: 40vh; caret-color: var(--ansi-green); }
  .doc > :is(p, h1, h2, h3, h4, h5, h6, div, blockquote), .doc > :is(ul, ol) > li { position: relative; counter-increment: ln; }
  .doc > :is(p, h1, h2, h3, h4, h5, h6, div, blockquote)::after, .doc > :is(ul, ol) > li::after {
    content: counter(ln); position: absolute; top: 0; left: calc(-1 * var(--gutter));
    width: calc(var(--gutter) - 1.4rem); text-align: right;
    font-family: var(--mono); font-weight: 400; font-style: normal; color: var(--color-slate);
  }
  .doc > :is(ul, ol) > li::after { left: calc(-1 * var(--gutter) - 1.4rem); }
  .doc h1, .doc h2, .doc h3, .doc h4, .doc h5, .doc h6 { font-family: var(--mono); scroll-margin-top: calc(var(--bar-h) + 1rem); }
  .doc h1 { counter-increment: h1 ln; counter-reset: h2; font-size: 17px; line-height: 1.5; color: var(--ansi-blue); margin-top: 2.5rem; }
  .doc h1:first-child { margin-top: 0; }
  .doc h2 { counter-increment: h2 ln; counter-reset: h3; font-size: 15px; line-height: 1.6; color: var(--ansi-cyan); }
  .doc h3 { counter-increment: h3 ln; font-size: 14px; line-height: 1.7; color: var(--ansi-green); }
  .doc h4 { font-size: 14px; color: var(--ansi-yellow); }
  .doc h5 { font-size: 14px; color: var(--ansi-magenta); }
  .doc h1::before, .doc h2::before, .doc h3::before { color: var(--color-steel); font-weight: 400; }
  .doc h1::before { content: counter(h1) ". "; }
  .doc h2::before { content: counter(h1) "." counter(h2) "  "; }
  .doc h3::before { content: counter(h1) "." counter(h2) "." counter(h3) "  "; }
  .doc:empty::before { content: 'escribí /h1 para abrir la primera sección'; color: var(--gris); }
  .doc ul { padding-left: 1.4rem; list-style-type: '- '; }
  .doc ul ul { list-style-type: '· '; }
  .doc ol { padding-left: 2rem; }
  .doc li { margin: .15rem 0; }
  .doc li::marker { color: var(--ansi-orange); }
  .doc strong, .doc b { color: var(--color-paper); }
  .doc em, .doc i { color: var(--ansi-yellow); }

  mark { --c: #d8c06a; background: none; color: inherit; cursor: pointer; }
  mark.mk-fondo { background: color-mix(in srgb, var(--c) 35%, transparent); padding: 0 .1em; }
  mark.mk-sub { border-bottom: 2px solid var(--c); }
  mark.mk-tacha { text-decoration: line-through; text-decoration-color: var(--c); text-decoration-thickness: 2px; }
  mark[data-nota]::after { content: '\00b0'; color: var(--acento); font-size: .9em; vertical-align: super; }
  mark.activa { outline: 1px solid var(--acento); outline-offset: 2px; }

  .ref { color: var(--acento); text-decoration: none; border-bottom: 1px dotted currentColor; cursor: pointer; }

  .globo, .menu-marca, .tip {
    position: fixed; background: var(--color-void); border: 1px solid var(--color-slate); border-radius: 0;
  }
  .globo {
    z-index: 60; max-width: 24rem; max-height: 14rem; overflow: hidden; padding: .7rem .9rem;
    font: 400 13px/1.6 var(--mono); color: var(--tinta);
  }
  .globo h4 { font: 700 12px/1.3 var(--mono); margin: 0 0 .35rem; color: var(--ansi-cyan); }
  .globo.roto { color: var(--gris); }

  .menu-marca { z-index: 70; display: flex; align-items: center; gap: .1rem; padding: .25rem; }
  .menu-marca button {
    border: 0; background: none; border-radius: 0; color: var(--tinta);
    padding: .35rem .4rem; display: grid; place-items: center; min-width: 1.8rem;
  }
  .menu-marca button:hover { background: var(--color-iron); }
  .menu-marca .tinta { width: 12px; height: 12px; min-width: 0; padding: 0; border-radius: 50%; margin: 0 .15rem; }
  .menu-marca .tinta[aria-pressed="true"] { outline: 1.5px solid var(--tinta); outline-offset: 2px; }
  .menu-marca .sep { width: 1px; height: 1.1rem; background: var(--linea); margin: 0 .25rem; }
  .menu-marca select { border: 0; background: none; color: var(--tinta); font: 400 12px/1 var(--mono); max-width: 18rem; padding: .35rem; }
  .menu-marca input[type="range"] { width: 8rem; accent-color: var(--acento); padding: 0 .4rem; }
  .menu-marca .cifra { font: 400 12px/1 var(--mono); color: var(--gris); min-width: 2.4rem; text-align: right; }
  .menu-marca input[type="text"] {
    border: 0; background: none; color: var(--tinta); outline: 0;
    font: 400 12px/1 var(--mono); width: 12rem; padding: .35rem .5rem;
  }
  .menu-marca input::placeholder { color: var(--gris); }

  .tarjeta {
    position: absolute; z-index: 10; width: 14rem; margin: 0; overflow: hidden;
    background: var(--color-graphite); border: 1px solid var(--linea);
    border-left: 2px solid var(--c, var(--acento)); border-radius: 0;
    font: 400 13px/1.6 var(--mono);
    opacity: .55; transition: opacity .15s ease;
  }
  .tarjeta:hover, .tarjeta:focus-within { opacity: 1; }
  .tarjeta .cuerpo { padding: .6rem .8rem; outline: 0; min-height: 2.4rem; }
  .tarjeta .cuerpo:empty::before { content: 'nota al margen'; color: var(--gris); }
  .tarjeta .asa {
    position: absolute; top: .25rem; right: .25rem; display: flex; gap: .1rem;
    opacity: 0; background: var(--color-void); border: 1px solid var(--linea);
  }
  .tarjeta:hover .asa, .tarjeta:focus-within .asa { opacity: 1; }
  .tarjeta .asa span, .tarjeta .asa button {
    border: 0; background: none; padding: .15rem .35rem;
    font: 400 12px/1.4 var(--mono); color: var(--gris);
  }
  .tarjeta .asa span { cursor: grab; }
  .tarjeta.arrastrando { outline: 1px solid var(--acento); }
  .tarjeta img { display: block; width: 100%; height: auto; }
  .tarjeta figcaption { padding: .5rem .8rem; color: var(--gris); outline: 0; font-size: 12px; }
  .tarjeta figcaption:empty::before { content: 'epígrafe'; color: var(--color-slate); }

  .doc img.inline { display: block; max-width: 100%; height: auto; margin: var(--spacing-24) auto; cursor: pointer; }
  .doc img.inline.activa { outline: 1px solid var(--acento); outline-offset: 3px; }

  .tip {
    z-index: 80; pointer-events: none; padding: .25rem .5rem;
    font: 400 12px/1.4 var(--mono); color: var(--tinta); white-space: nowrap;
  }
  .pastilla button.grabando { color: var(--mal); animation: latir .8s ease-in-out infinite alternate; }
  @keyframes latir { to { opacity: .35; } }
  .provisional { color: var(--gris); }

  .arbol .plegar {
    flex: 0 0 1rem; padding: 0; border: 0; background: none; cursor: pointer;
    color: var(--gris); font: 400 13px/1 var(--mono); transition: transform .15s;
  }
  .arbol .plegar:hover { color: var(--acento); }
  .arbol .plegar[aria-expanded="true"] { transform: rotate(90deg); }
  .arbol a.n2 { padding-left: 1rem; } .arbol a.n3 { padding-left: 2rem; }
  .arbol #indice a.n1 { color: var(--ansi-blue); }
  .arbol .nada { color: var(--color-steel); padding: 0 .3rem; margin: 0; }

  @media (max-width: 1280px) {
    .tarjeta { position: static !important; width: auto; margin: 1rem 0; }
  }
</style>

<body>
<script>
/* Paleta de resaltado y de tarjetas. Editá este array y cambia toda la app. */
const COLORES = ['#d8c06a', '#8fbf7f', '#d67a6a', '#5a9be0', '#a88cc4', '#66b8c4', '#d08a4c'];

/* Iconos. viewBox 20x20, trazo de 1.5, heredan el color del botón. */
const ICO = {
  atras:      '<path d="M9 4.5 3.5 10 9 15.5"/><path d="M3.5 10h13"/>',
  resaltar:   '<path d="M3.5 16.5h13"/><path d="M6.5 13.5 12.5 3.5l3.5 2.2-6 10.3z"/><path d="M6.5 13.5 10 15.7"/>',
  subrayar:   '<path d="M6 3v5.5a4 4 0 0 0 8 0V3"/><path d="M4.5 16.8h11"/>',
  tachar:     '<path d="M3.5 10h13"/><path d="M13.5 5.6a3.4 2.7 0 0 0-6.2 1.1c0 1.6 1.7 2.2 3.2 2.6"/><path d="M7 13.4a3.4 2.7 0 0 0 6.4-.6"/>',
  referencia: '<path d="M8.6 11.4a3.2 3.2 0 0 0 4.5 0l2.6-2.6a3.2 3.2 0 0 0-4.5-4.5l-.9.9"/><path d="M11.4 8.6a3.2 3.2 0 0 0-4.5 0L4.3 11.2a3.2 3.2 0 0 0 4.5 4.5l.9-.9"/>',
  nota:       '<path d="M4 3.5h12v8.5l-3.5 4H4z"/><path d="M16 12h-3.5v4"/>',
  voz:        '<rect x="7.5" y="2.5" width="5" height="9" rx="2.5"/><path d="M4.5 9.5a5.5 5.5 0 0 0 11 0"/><path d="M10 15v2.5"/>',
  imagen:     '<rect x="3" y="4" width="14" height="12" rx="1.5"/><circle cx="7.3" cy="8" r="1.2"/><path d="M3.6 14.2 8 10l3 2.8 2.2-2 3.2 3"/>',
  sol:        '<circle cx="10" cy="10" r="3.3"/><path d="M10 2.2v1.9M10 15.9v1.9M2.2 10h1.9M15.9 10h1.9M4.6 4.6l1.3 1.3M14.1 14.1l1.3 1.3M15.4 4.6l-1.3 1.3M5.9 14.1l-1.3 1.3"/>',
  luna:       '<path d="M16.3 11.8A6.6 6.6 0 0 1 8.2 3.7a6.6 6.6 0 1 0 8.1 8.1z"/>',
  comentar:   '<path d="M3.5 4h13v8.5h-8L4.5 16v-3.5h-1z"/>',
  quitar:     '<path d="M5 5l10 10M15 5 5 15"/>',
  diagrama:   '<rect x="7" y="2.5" width="6" height="4" rx="1"/><rect x="1.8" y="13.5" width="5.4" height="4" rx="1"/><rect x="12.8" y="13.5" width="5.4" height="4" rx="1"/><path d="M10 6.5v3M4.5 13.5v-2.5h11v2.5"/>',
  formula:    '<path d="M14.6 4.2H6.4l4.6 5.8-4.6 5.8h8.2"/>',
  arrastrar:  '<circle cx="7" cy="6" r="1"/><circle cx="13" cy="6" r="1"/><circle cx="7" cy="10" r="1"/><circle cx="13" cy="10" r="1"/><circle cx="7" cy="14" r="1"/><circle cx="13" cy="14" r="1"/>',
};
const svg = (n, t = 16) => `<svg viewBox="0 0 20 20" width="${t}" height="${t}" fill="none"
  stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${ICO[n]}</svg>`;

document.documentElement.dataset.fuente = localStorage.getItem('fuente') || 'mono';

const { app, arbol, herramientas, ruta, modo } = montarShell('notas');
const zoom = () => parseFloat(app.style.zoom) || 1;
const esc = s => String(s).replace(/[<>&"]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]));
const slug = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '')
  .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'seccion';

let color = COLORES[0], doc, portada, subtitulo, indice, tema, ultimoRango;

/* ---------- menú de temas ---------- */
async function cargarTemas() {
  return (await (await fetch('/api/temas')).json()).temas;
}

function armarArbol(temas, actual) {
  arbol.innerHTML = temas.map(t => `<details open${t.slug === actual ? ' class="actual"' : ''}>
    <summary title="${esc(t.titulo)}"><span class="nombre">${esc(t.slug)}/</span><span class="cuenta">${t.secciones}</span></summary>
    ${t.slug === actual ? '<div id="recursos"></div><div id="indice"></div>'
      : `<ol>${t.indice.map((h, i) => `<li><a href="?tema=${encodeURIComponent(t.slug)}#${slug(h)}">
          <span class="n">${i + 1}</span><span>${esc(h)}</span></a></li>`).join('')
        || '<li class="vacio">(vacío)</li>'}</ol>`}
  </details>`).join('');
}

async function menu() {
  let temas;
  try {
    temas = await cargarTemas();
  } catch {
    app.innerHTML = `<div class="hoja"><p class="prompt"><span class="p-sig">✕</span> falta el servidor</p>
      <p>Abrí una terminal en la carpeta y corré <code>npm run notes</code>.</p></div>`;
    return;
  }
  armarArbol(temas, null);
  ruta('~/notes/temas');
  app.innerHTML = `
    <div class="hoja">
    <p class="prompt"><span class="p-host">notes</span> <span class="p-dir">~/temas</span> <span class="p-sig">❯</span> ls -l</p>
    <table class="htop">
      <thead><tr><th class="num">#</th><th>TEMA</th><th>TIPO</th><th class="num">SECC</th><th class="num">REC</th></tr></thead>
      <tbody>${temas.map(l => `
        <tr onclick="location.search='?tema=${encodeURIComponent(l.slug)}'">
          <td class="num">${l.orden < 999 ? String(l.orden).padStart(2, '0') : '—'}</td>
          <td class="ancha"><a href="?tema=${encodeURIComponent(l.slug)}">${esc(l.titulo)}</a><br><span class="sub">${esc(l.subtitulo || '')}</span></td>
          <td class="tipo">${esc(l.tipo)}</td>
          <td class="num${l.secciones ? '' : ' cero'}">${l.secciones}</td>
          <td class="num${l.recursos ? '' : ' cero'}">${l.recursos}</td>
        </tr>`).join('')}</tbody>
    </table>
    <div class="tildes"></div></div>`;
}

/* ---------- cuaderno ---------- */
async function abrirTema(nombre) {
  const [t, temas] = await Promise.all([
    fetch('/api/tema/' + encodeURIComponent(nombre)).then(r => r.json()), cargarTemas()]);
  tema = t;
  if (tema.error) throw new Error(tema.error);
  document.title = tema.titulo;
  armarArbol(temas, tema.slug);
  ruta(`~/notes/temas/${tema.slug}/notas`);

  herramientas.innerHTML = `
    <div class="wb-mod pastilla">
      <select id="bloque" data-tip="Tipo de bloque">
        <option value="p">párrafo</option>
        ${[1, 2, 3, 4, 5, 6].map(n => `<option value="h${n}">título ${n}</option>`).join('')}
        <option value="lista">lista</option>
        <option value="ol">lista numerada</option>
      </select>
      <select id="fuente" data-tip="Fuente de lectura">
        <option value="mono">mono</option>
        <option value="serif">serif</option>
        <option value="inter">inter</option>
      </select>
    </div>
    <div class="wb-mod pastilla">
      <button data-cmd="bold" data-tip="Negrita · ⌘B" style="font-weight:700">B</button>
      <button data-cmd="italic" data-tip="Cursiva · ⌘I" style="font-style:italic">I</button>
    </div>
    <div class="wb-mod pastilla">
      ${COLORES.map((c, i) => `<button class="tinta" style="--c:${c};background:${c}"
        data-color="${c}" aria-pressed="${i === 0}" data-tip="Color ${c}"></button>`).join('')}
      <button data-marca="mk-fondo" data-tip="Resaltar">${svg('resaltar')}</button>
      <button data-marca="mk-sub" data-tip="Subrayar">${svg('subrayar')}</button>
      <button data-marca="mk-tacha" data-tip="Tachar">${svg('tachar')}</button>
    </div>
    <div class="wb-mod pastilla">
      <button id="referencia" data-tip="Referencia a una sección · o escribí [[nombre]]">${svg('referencia')}</button>
      <button id="tarjeta" data-tip="Nota al margen">${svg('nota')}</button>
      <button id="imagen" data-tip="Imagen · también podés pegarla o soltarla">${svg('imagen')}</button>
      <input type="file" id="archivo-img" accept="image/*" hidden>
      <button id="diagrama" data-tip="Diagrama · Mermaid">${svg('diagrama')}</button>
      <button id="formula" data-tip="Fórmula · LaTeX">${svg('formula')}</button>
      <button id="voz" data-tip="Dictar · ⌃M para empezar y terminar">${svg('voz')}</button>
    </div>`;
  app.innerHTML = `
    
    <div class="pagina">
      <header class="portada">
        <p class="prompt"><span class="p-host">notes</span> <span class="p-dir">~/temas/${esc(tema.slug)}</span> <span class="p-sig">❯</span> nvim notas/</p>
        <h1 id="titulo" contenteditable>${esc(tema.titulo)}</h1>
        <p id="subtitulo" contenteditable>${esc(tema.subtitulo || '')}</p>
      </header>
      <div class="doc" id="doc" contenteditable spellcheck="true"></div>
      <div class="tildes"></div>
    </div>`;

  doc = document.getElementById('doc');
  portada = document.getElementById('titulo');
  subtitulo = document.getElementById('subtitulo');
  indice = document.getElementById('indice');
  armarRecursos();
  doc.innerHTML = tema.html || '';
  vizPaint(doc);
  colocarTarjetas();
  armarIndice();
  if (location.hash) irA(decodeURIComponent(location.hash.slice(1)));

  doc.addEventListener('focusin', () => modo('INSERT', 'insert'));
  doc.addEventListener('focusout', () => modo('NORMAL'));
  const selFuente = document.getElementById('fuente');
  selFuente.value = localStorage.getItem('fuente') || 'mono';
  selFuente.onchange = () => {
    document.documentElement.dataset.fuente = selFuente.value;
    localStorage.setItem('fuente', selFuente.value);
  };
  doc.addEventListener('input', () => {
    if (!atajos()) autoRef();
    armarIndice();
    guardar();
  });
  [portada, subtitulo].forEach(e => e.addEventListener('input', guardar));

  doc.onclick = e => {
    const a = e.target.closest?.('.ref');
    if (a) { e.preventDefault(); return irA(a.hash.slice(1)); }
    const fig = e.target.closest?.('figure.viz');
    if (fig) return menuViz(fig);
    const img = e.target.closest?.('img.inline');
    if (img) return menuImagen(img);
    const m = e.target.closest?.('mark');
    m ? menuMarca(m) : cerrarMenu();
  };
  doc.addEventListener('mouseover', e => {
    const a = e.target.closest?.('.ref');
    if (a) return globoRef(a);
    const m = e.target.closest?.('mark[data-nota]');
    if (m) globoNota(m);
  });
  addEventListener('keydown', e => {
    if (e.key === 'Escape') { cerrarMenu(); cerrarGlobo(); cerrarTip(); }
    // ⌘M no llega: macOS lo usa para minimizar antes que el navegador
    if (e.ctrlKey && e.code === 'KeyM') { e.preventDefault(); dictar(document.getElementById('voz')); }
  });

  document.getElementById('bloque').onchange = e => {
    restaurar();
    aplicarBloque(e.target.value);
    armarIndice(); guardar();
  };
  // mousedown en la barra movería el foco fuera del editable y execCommand
  // dejaría de aplicar. Cancelarlo mantiene cursor y selección.
  herramientas.querySelectorAll('button').forEach(b => b.onmousedown = e => e.preventDefault());
  herramientas.addEventListener('mouseover', e => {
    const el = e.target.closest('[data-tip]');
    if (el) mostrarTip(el);
  });
  herramientas.querySelectorAll('[data-cmd]').forEach(b => b.onclick = () => {
    // ponytail: execCommand para negrita/cursiva nomás. Deprecado pero anda en
    // todo navegador actual y evita escribir un editor entero.
    restaurar(); document.execCommand(b.dataset.cmd); guardar();
  });
  herramientas.querySelectorAll('[data-color]').forEach(b => b.onclick = () => {
    color = b.dataset.color;
    herramientas.querySelectorAll('[data-color]').forEach(o => o.setAttribute('aria-pressed', o === b));
  });
  herramientas.querySelectorAll('[data-marca]').forEach(b => b.onclick = () => marcar(b.dataset.marca));
  document.getElementById('referencia').onclick = e => menuReferencia(e.currentTarget);
  document.getElementById('tarjeta').onclick = () => { crearTarjeta({}); guardar(); };
  document.getElementById('imagen').onclick = () => document.getElementById('archivo-img').click();
  document.getElementById('archivo-img').onchange = e => insertarImagen(e.target.files[0]);
  document.getElementById('diagrama').onclick = () => insertarViz('mermaid');
  document.getElementById('formula').onclick = () => insertarViz('math');
  document.getElementById('voz').onclick = e => dictar(e.currentTarget);
  doc.addEventListener('paste', e => {
    const dt = e.clipboardData;
    // una captura de pantalla llega en `items`, un archivo del Finder en `files`
    const f = [...(dt.files || [])].find(x => x.type.startsWith('image/'))
      || [...(dt.items || [])].filter(i => i.kind === 'file' && i.type.startsWith('image/'))
           .map(i => i.getAsFile())[0];
    if (f) { e.preventDefault(); insertarImagen(f); }
  });
  doc.addEventListener('dragover', e => e.preventDefault());
  doc.addEventListener('drop', e => {
    const f = [...e.dataTransfer.files].find(f => f.type.startsWith('image/'));
    if (f) { e.preventDefault(); insertarImagen(f); }
  });
}

/* Imagen en el flujo del texto. Para una flotante: creás una nota al margen y
   pegás la imagen adentro; el mismo handler la inserta donde esté el cursor. */
function insertarImagen(archivo) {
  if (!archivo) return;
  const lector = new FileReader();
  lector.onload = () => {
    restaurar();
    document.execCommand('insertHTML', false, `<img class="inline" src="${lector.result}" alt="">`);
    guardar();
  };
  lector.readAsDataURL(archivo);
}

/* ---------- dictado ---------- */
/* Whisper local en server.py. No transcribe en streaming: mientras hablás se
   retranscribe en loop el audio acumulado y el texto provisional (gris) se va
   pisando, como el teclado del celular. Pasados FIJAR_S segundos se fija todo
   menos el último segmento y el audio se recorta ahí, así cada vuelta sigue
   siendo corta. Float32 a 16 kHz directo del micrófono: el server no necesita ffmpeg. */
const TASA = 16000, FIJAR_S = 15;
let dictado;

async function dictar(boton) {
  if (dictado) return dictado.fin = true;
  const estado = document.getElementById('estado');
  let mic;
  try {
    mic = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    return estado.textContent = 'Sin micrófono: ' + e.message;
  }
  const d = dictado = { trozos: [], largo: 0, fin: false };
  const ctx = new AudioContext({ sampleRate: TASA });
  // ponytail: ScriptProcessor está deprecado pero anda en todo navegador y evita
  // un AudioWorklet en archivo aparte. Pasar a AudioWorklet si alguno lo saca.
  const nodo = ctx.createScriptProcessor(4096, 1, 1);
  nodo.onaudioprocess = e => {
    const c = e.inputBuffer.getChannelData(0).slice();
    d.trozos.push(c);
    d.largo += c.length;
  };
  ctx.createMediaStreamSource(mic).connect(nodo);
  nodo.connect(ctx.destination);   // sin esto Chrome no dispara onaudioprocess; la salida es silencio

  restaurar();
  const span = document.createElement('span');
  span.className = 'provisional';
  const sel = getSelection();
  sel.rangeCount ? sel.getRangeAt(0).insertNode(span) : doc.append(span);
  boton.classList.add('grabando');
  estado.textContent = 'Escuchando… clic en el micrófono para terminar';

  let enviado = 0, error;
  try {
    while (true) {
      const fin = d.fin;
      if (fin) { mic.getTracks().forEach(t => t.stop()); nodo.disconnect(); }
      // nada nuevo, o menos de 1 s (un silencio corto hace alucinar a Whisper)
      if (d.largo === enviado || (!fin && d.largo < TASA)) {
        if (fin) break;
        await new Promise(r => setTimeout(r, 200));
        continue;
      }
      const n = d.trozos.length, audio = new Float32Array(d.largo);
      d.trozos.reduce((o, t) => (audio.set(t, o), o + t.length), 0);
      enviado = audio.length;
      const r = await (await fetch('/api/voz', { method: 'POST', body: audio })).json();
      if (r.error) throw new Error(r.error);

      if (fin) { if (r.texto) span.before(r.texto + ' '); break; }
      const segs = r.segmentos;
      if (audio.length > FIJAR_S * TASA && segs.length > 1) {
        span.before(segs.slice(0, -1).map(s => s[1]).join(' ') + ' ');
        const desde = Math.round(segs.at(-1)[0] * TASA);
        d.trozos.splice(0, n, audio.slice(desde));   // lo que llegó durante el fetch queda atrás
        d.largo -= desde;
        enviado -= desde;
        span.textContent = segs.at(-1)[1];
      } else {
        span.textContent = r.texto;
      }
    }
  } catch (e) {
    error = e;
  } finally {
    mic.getTracks().forEach(t => t.stop());
    ctx.close();
    span.remove();
    dictado = null;
    boton.classList.remove('grabando');
    armarIndice();
  }
  // ponytail: con error no se guarda para no pisar el mensaje; lo fijado se guarda en la próxima tecla
  error ? estado.textContent = 'Sin transcribir: ' + error.message : guardar();
}

/* ---------- selección ---------- */
document.addEventListener('selectionchange', () => {
  const sel = getSelection();
  if (!sel.rangeCount || !doc?.contains(sel.anchorNode)) return;
  ultimoRango = sel.getRangeAt(0);
  document.getElementById('bloque').value = bloqueActual();
});

function restaurar() {
  doc.focus();
  if (!ultimoRango) return;
  const sel = getSelection();
  sel.removeAllRanges();
  sel.addRange(ultimoRango);
}

function envolver(crear) {
  restaurar();
  const sel = getSelection();
  if (!sel.rangeCount || sel.isCollapsed) return null;
  const rango = sel.getRangeAt(0);
  const el = crear();
  el.appendChild(rango.extractContents());
  rango.insertNode(el);
  sel.removeAllRanges();
  guardar();
  return el;
}

function marcar(clase) {
  const m = envolver(() => {
    const el = document.createElement('mark');
    el.className = clase;
    el.style.setProperty('--c', color);
    return el;
  });
  if (m) menuMarca(m);
  return m;
}

/* ---------- bloques: título, párrafo, lista ---------- */
/* Sin execCommand('formatBlock'): no aplica sobre texto suelto dentro del
   contenteditable, que es justo el caso de un documento vacío. */
const BLOQUES = 'h1,h2,h3,h4,h5,h6,p,li,blockquote';

function bloqueDe(nodo) {
  const el = nodo?.nodeType === 3 ? nodo.parentElement : nodo;
  const b = el?.closest(BLOQUES);
  return b && doc.contains(b) ? b : null;
}

function caretAlFinal(el) {
  const r = document.createRange();
  r.selectNodeContents(el);
  r.collapse(false);
  const sel = getSelection();
  sel.removeAllRanges();
  sel.addRange(r);
}

function bloqueActual() {
  const b = bloqueDe(getSelection().anchorNode);
  if (!b) return 'p';
  if (b.tagName === 'LI') return b.parentElement.tagName === 'OL' ? 'ol' : 'lista';
  return /^H[1-6]$/.test(b.tagName) ? b.tagName.toLowerCase() : 'p';
}

function conCaret(cambio) {
  const sel = getSelection();
  const n = sel.anchorNode, o = sel.anchorOffset;
  const el = cambio();
  if (!el.textContent && !el.querySelector('img')) el.innerHTML = '<br>';
  if (!n?.isConnected || !el.contains(n)) return caretAlFinal(el);
  const r = document.createRange();
  r.setStart(n, Math.min(o, n.nodeType === 3 ? n.length : n.childNodes.length));
  r.collapse(true);
  sel.removeAllRanges();
  sel.addRange(r);
}

function aplicarBloque(tag) {
  const nodo = getSelection().anchorNode;
  if (!nodo || !doc.contains(nodo)) return;
  const b = bloqueDe(nodo);
  const li = b?.tagName === 'LI' ? b : null;

  if (tag === 'lista' || tag === 'ul' || tag === 'ol') {
    const tipo = tag === 'ol' ? 'OL' : 'UL';
    if (li) return li.parentElement.tagName === tipo || conCaret(() => {
      const vieja = li.parentElement, nueva = document.createElement(tipo);
      nueva.append(...vieja.childNodes);
      vieja.replaceWith(nueva);
      return li;
    });
    return conCaret(() => {
      const lista = document.createElement(tipo);
      const item = lista.appendChild(document.createElement('li'));
      mudar(nodo, lista, item);
      return item;
    });
  }
  conCaret(() => {
    const el = document.createElement(tag);
    if (!li) {
      mudar(nodo, el, el);
      return el;
    }
    const lista = li.parentElement;
    const resto = [];
    for (let n = li.nextElementSibling; n; n = n.nextElementSibling) resto.push(n);
    if (resto.length) {
      const cola = document.createElement(lista.tagName);
      cola.append(...resto);
      lista.after(cola);
    }
    el.append(...li.childNodes);
    lista.after(el);
    li.remove();
    if (!lista.children.length) lista.remove();
    return el;
  });
}

/* Mete el renglón actual dentro de `envase`, dejando el contenido en `destino`. */
function mudar(nodo, envase, destino) {
  const bloque = bloqueDe(nodo);
  const padre = nodo.nodeType === 3 ? nodo.parentElement : nodo;
  if (bloque) {
    destino.append(...bloque.childNodes);
    bloque.replaceWith(envase);
  } else if (padre && padre !== doc && padre.tagName === 'DIV' && doc.contains(padre)) {
    destino.append(...padre.childNodes);   // el <div> que arma Chrome al dar Enter
    padre.replaceWith(envase);
  } else {
    nodo.replaceWith(envase);
    destino.appendChild(nodo);
  }
}

/* ---------- atajos de escritura: /h1, /lista, "- " ---------- */
function atajos() {
  const sel = getSelection();
  const n = sel.anchorNode;
  if (!n || n.nodeType !== 3 || !doc.contains(n)) return false;

  const antes = n.data.slice(0, sel.anchorOffset).replace(/\u00a0/g, ' ');
  const m = /^(?:\/(h[1-6]|p|lista|ul|ol)|([-*]) |(\d+)\. )$/i.exec(antes);
  if (!m) return false;
  // tiene que ser el arranque del renglón: nada escrito antes en el mismo bloque
  if (n.previousSibling?.textContent.trim()) return false;

  n.deleteData(0, sel.anchorOffset);
  aplicarBloque(m[1] ? m[1].toLowerCase() : m[2] ? 'lista' : 'ol');
  return true;
}

/* ---------- referencias ---------- */
/* Convierte [[texto]] en referencia apenas se cierra el corchete. */
function autoRef() {
  const sel = getSelection();
  const n = sel.anchorNode;
  if (!n || n.nodeType !== 3) return;
  const m = /\[\[([^\[\]]+)\]\]$/.exec(n.data.slice(0, sel.anchorOffset));
  if (!m) return;
  const rango = document.createRange();
  rango.setStart(n, sel.anchorOffset - m[0].length);
  rango.setEnd(n, sel.anchorOffset);
  rango.deleteContents();
  const a = document.createElement('a');
  a.className = 'ref';
  a.href = '#' + slug(m[1]);
  a.textContent = m[1];
  rango.insertNode(a);
  const cola = document.createTextNode(' ');
  a.after(cola);
  const r2 = document.createRange();
  r2.setStart(cola, 1);
  r2.collapse(true);
  sel.removeAllRanges();
  sel.addRange(r2);
}

const encabezados = () => [...doc.querySelectorAll('h1,h2,h3,h4,h5,h6')];

function irA(id) {
  encabezados().find(h => h.id === id)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ---------- globos de lectura ---------- */
let globo;
const cerrarGlobo = () => { globo?.remove(); globo = null; };

function mostrarGlobo(ancla, html, roto) {
  cerrarGlobo();
  globo = document.createElement('div');
  globo.className = 'globo' + (roto ? ' roto' : '');
  globo.innerHTML = html;
  document.body.appendChild(globo);
  const c = ancla.getBoundingClientRect();
  globo.style.left = Math.max(8, Math.min(c.left, innerWidth - globo.offsetWidth - 16)) + 'px';
  globo.style.top = (c.bottom + 8 + globo.offsetHeight > innerHeight
    ? c.top - globo.offsetHeight - 8 : c.bottom + 8) + 'px';
  const salir = () => { cerrarGlobo(); ancla.removeEventListener('mouseleave', salir); };
  ancla.addEventListener('mouseleave', salir);
}

function globoNota(marca) {
  mostrarGlobo(marca, `<h4>Comentario</h4>${esc(marca.dataset.nota)}`);
}

function globoRef(a) {
  const id = a.hash.slice(1);
  const destino = encabezados().find(h => h.id === id);
  if (!destino) return mostrarGlobo(a, 'Todavía no existe una sección con ese nombre.', true);
  const nivel = +destino.tagName[1];
  const trozos = [];
  for (let n = destino.nextElementSibling; n; n = n.nextElementSibling) {
    if (/^H[1-6]$/.test(n.tagName) && +n.tagName[1] <= nivel) break;
    if (!n.classList.contains('tarjeta')) trozos.push(n.textContent);
  }
  const cuerpo = trozos.join(' ').replace(/\s+/g, ' ').trim();
  mostrarGlobo(a, `<h4>${esc(destino.textContent)}</h4>` +
    esc(cuerpo.slice(0, 420) || 'Sección vacía.') + (cuerpo.length > 420 ? '…' : ''));
}

/* ---------- menús flotantes: marca, imagen, referencia ---------- */
let menu2, activo;

function cerrarMenu() {
  menu2?.remove();
  menu2 = null;
  activo?.classList.remove('activa');
  activo = null;
}

function abrirMenu(ancla, html) {
  cerrarMenu();
  cerrarGlobo();
  activo = ancla;
  ancla.classList.add('activa');
  menu2 = document.createElement('div');
  menu2.className = 'menu-marca';
  menu2.innerHTML = html;
  document.body.appendChild(menu2);
  const c = ancla.getBoundingClientRect();
  menu2.style.left = Math.max(8, Math.min(c.left, innerWidth - menu2.offsetWidth - 16)) + 'px';
  menu2.style.top = (c.bottom + 8 + menu2.offsetHeight > innerHeight
    ? c.top - menu2.offsetHeight - 8 : c.bottom + 8) + 'px';
  // no robarle el foco al editor, salvo en los campos donde se escribe o elige
  menu2.onmousedown = e => { if (!['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) e.preventDefault(); };
  return menu2;
}

function menuMarca(marca) {
  const actual = marca.style.getPropertyValue('--c').trim();
  const m = abrirMenu(marca,
    COLORES.map(c => `<button class="tinta" data-color="${c}" style="background:${c}"
        aria-pressed="${c === actual}" data-tip="${c}"></button>`).join('')
    + '<span class="sep"></span>'
    + `<input type="text" id="nota-marca" placeholder="Comentario…" value="${esc(marca.dataset.nota || '')}">`
    + `<button data-accion="quitar" data-tip="Quitar la marca">${svg('quitar', 14)}</button>`);

  m.querySelectorAll('[data-color]').forEach(b => b.onclick = () => {
    marca.style.setProperty('--c', b.dataset.color);
    m.querySelectorAll('[data-color]').forEach(o => o.setAttribute('aria-pressed', o === b));
    guardar();
  });
  const campo = m.querySelector('#nota-marca');
  campo.oninput = () => {
    campo.value.trim() ? marca.dataset.nota = campo.value.trim() : delete marca.dataset.nota;
    guardar();
  };
  campo.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); cerrarMenu(); } };
  m.querySelector('[data-accion="quitar"]').onclick = () => {
    marca.replaceWith(...marca.childNodes);
    cerrarMenu();
    guardar();
  };
}

function menuReferencia(boton) {
  const lista = listaEncabezados();
  if (!lista.length) return abrirMenu(boton,
    '<span class="cifra" style="min-width:0">Todavía no hay secciones a las que apuntar.</span>');

  const m = abrirMenu(boton, `<select id="destino-ref" size="1">
      ${lista.map(h => `<option value="${h.id}">${'\u00a0'.repeat((h.nivel - 1) * 3)}${esc(h.numero)} ${esc(h.texto)}</option>`).join('')}
    </select>`);

function insertarRef(id, texto) {
  restaurar();
  const sel = getSelection();

    envolver(() => {
      const a = document.createElement('a');
      a.className = 'ref';
      a.href = '#' + id;
      return a;
    });
  } else {
    document.execCommand('insertHTML', false, `<a class="ref" href="#${id}">${esc(texto)}</a>&nbsp;`);
  }

}

/* ---------- ayuda al pasar el mouse por la barra ---------- */
let tip;

/* ---------- recursos: archivos de recursos/ y enlaces de tema.json ---------- */
function armarRecursos() {
  const caja = document.getElementById('recursos');
  const filas = [
    ...(tema.recursos || []).map(r =>
      `<li><a href="${r.ruta}" target="_blank" title="${esc(r.nombre)}"><span>${esc(r.nombre)}</span><span class="peso">${r.kb} KB</span></a></li>`),
    ...(tema.enlaces || []).map(e =>

/* ---------- índice ---------- */
/* Encabezados con su numeración calculada. Lo usan el índice y el selector
   de referencias, así que la numeración se calcula en un solo lugar. */
function listaEncabezados() {
  const n = [0, 0, 0];
  return encabezados().map(h => {
    const nivel = +h.tagName[1];
    if (nivel <= 3) {
      n[nivel - 1]++;
      for (let i = nivel; i < 3; i++) n[i] = 0;
    }
    h.id = slug(h.textContent);
    return { id: h.id, nivel, texto: h.textContent, numero: nivel <= 3 ? n.slice(0, nivel).join('.') : '' };
  });
}

/* Plegable: arranca todo plegado y cada flecha despliega solo sus hijos
   directos. Vive afuera porque el índice se rearma en cada tecla. */
const abiertos = new Set();

function armarIndice() {
  const lista = listaEncabezados();
  const ancestros = [];
  const filas = lista.map((h, i) => {
    while (ancestros.length && ancestros.at(-1).nivel >= h.nivel) ancestros.pop();
    const oculta = ancestros.some(a => !abiertos.has(a.id));
    ancestros.push(h);
    const flecha = lista[i + 1]?.nivel > h.nivel
      ? `<button class="plegar" data-id="${h.id}" aria-expanded="${abiertos.has(h.id)}" aria-label="Plegar o desplegar">›</button>`
      : '<span class="plegar"></span>';
    return `<li${oculta ? ' hidden' : ''}>${flecha}<a href="#${h.id}" class="n${h.nivel}">
      <span class="n">${esc(h.numero)}</span><span>${esc(h.texto)}</span></a></li>`;
  });
  indice.innerHTML = filas.length
    ? `<div class="carpeta">notas/</div><ol>${filas.join('')}</ol>`
    : '<p class="nada">(sin títulos)</p>';
  indice.querySelectorAll('a').forEach(a => a.onclick = e => {
    e.preventDefault(); irA(a.hash.slice(1));
  });
  indice.querySelectorAll('button.plegar').forEach(b => b.onclick = () => {
    abiertos.delete(b.dataset.id) || abiertos.add(b.dataset.id);
    armarIndice();
  });
}

/* ---------- tarjetas ---------- */
function crearTarjeta({ x, y, c, cuerpo = '', img = null, epigrafe = '' }) {
  const el = document.createElement('aside');
  el.className = 'tarjeta';
  el.contentEditable = 'false';
  el.style.setProperty('--c', c || color);
  el.dataset.x = x ?? doc.offsetWidth + 32;
  el.dataset.y = y ?? Math.max(0, Math.round(scrollY / zoom() + 100 - doc.offsetTop));
  el.innerHTML = asa()
    + (img ? `<img src="${img}" alt=""><figcaption contenteditable>${esc(epigrafe)}</figcaption>`
           : `<div class="cuerpo" contenteditable>${cuerpo}</div>`);
  doc.appendChild(el);
  activarTarjeta(el);
  colocar(el);
  return el;
}

const asa = () => `<div class="asa"><span title="Arrastrar">${svg('arrastrar', 13)}</span>
  <button title="Borrar">${svg('quitar', 12)}</button></div>`;

function colocar(el) {
  el.style.left = el.dataset.x + 'px';
  el.style.top = el.dataset.y + 'px';
}

function colocarTarjetas() {
  doc.querySelectorAll('.tarjeta').forEach(el => {
    el.contentEditable = 'false';
    if (!el.querySelector('.asa')) el.insertAdjacentHTML('afterbegin', asa());
    colocar(el);
    activarTarjeta(el);
  });
}

function activarTarjeta(el) {
  el.querySelector('.asa button').onclick = () => { el.remove(); guardar(); };
  el.querySelectorAll('[contenteditable=""],[contenteditable="true"]')
    .forEach(c => c.addEventListener('input', guardar));

  const mango = el.querySelector('.asa span');
  mango.onpointerdown = e => {
    const z = zoom(), dx = e.clientX / z - el.offsetLeft, dy = e.clientY / z - el.offsetTop;
    mango.setPointerCapture(e.pointerId);
    el.classList.add('arrastrando');
    mango.onpointermove = m => {
      el.dataset.x = Math.round(Math.min(doc.offsetWidth + 340, Math.max(-280, m.clientX / z - dx)));
      el.dataset.y = Math.max(0, Math.round(m.clientY / z - dy));
      colocar(el);
    };
    mango.onpointerup = () => {
      mango.onpointermove = mango.onpointerup = null;
      el.classList.remove('arrastrando');
      guardar();
    };
  };
}

/* ---------- guardado ---------- */
function instantanea() {
  const copia = doc.cloneNode(true);
  copia.querySelectorAll('mark').forEach(m => m.classList.remove('activa'));
  copia.querySelectorAll('.provisional').forEach(s => s.remove());   // dictado a medio transcribir
  copia.querySelectorAll('figure.viz').forEach(f => {
    f.classList.remove('painted', 'activa');   // el SVG es derivado: manda el <pre class="src">
    f.removeAttribute('data-error');
    f.querySelector('.view')?.replaceChildren();
  });
  copia.querySelectorAll('.tarjeta').forEach(t => {
    t.removeAttribute('style');            // la posición vive en data-x / data-y
    t.removeAttribute('contenteditable');
    t.querySelector('.asa')?.remove();     // el asa se vuelve a inyectar al abrir
  });
  return copia.innerHTML;
}

let pendiente;
function guardar() {
  clearTimeout(pendiente);
  const estado = document.getElementById('estado');
  estado.textContent = 'guardando…';
  pendiente = setTimeout(async () => {
    try {
      const r = await (await fetch('/api/tema/' + encodeURIComponent(tema.slug), {
        method: 'POST',
        body: JSON.stringify({
          titulo: portada.textContent.trim(),
          subtitulo: subtitulo.textContent.trim(),
          html: instantanea()
        })
      })).json();
      if (r.error) throw new Error(r.error);
      const hora = new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
      estado.textContent = `${hora} · ${r.secciones.length} ${r.secciones.length === 1 ? 'sección' : 'secciones'}`;
    } catch (e) {
      estado.textContent = 'Sin guardar: ' + e.message;
    }
  }, 900);
}

/* Arranca al final: abrirLibro() usa las variables `let` de arriba. */
const slugTema = new URLSearchParams(location.search).get('tema');
slugTema
  ? abrirTema(slugTema).catch(e => app.innerHTML =
      `<div class="hoja"><h1>No se pudo abrir el tema</h1><p class="menor">${esc(e.message)}</p>
       <p><a href="notas.html">Volver</a></p></div>`)
  : menu();
</script>
